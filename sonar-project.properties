sonar.projectKey=grillingstone
sonar.projectName=Grilling Stone

sonar.sources=src,core,server
sonar.tests=src,core,server,test
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,test/**
sonar.exclusions=**/*.test.ts,**/*.test.tsx,src/components/ui/**
sonar.coverage.exclusions=src/main.tsx,server/main.ts,core/testing/**

sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.tsconfigPaths=tsconfig.json

# Keep the scanner's scratch files with the other git-ignored tool output.
sonar.working.directory=data-sonar/scannerwork
