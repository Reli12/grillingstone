# Runs Grilling Stone with only Docker on the host. See docker/README.md.
#   docker compose -f docker/compose.yml build
#   docker compose -f docker/compose.yml run --rm grillingstone login claude   (once; or: login codex)
#   docker compose -f docker/compose.yml up                         then open http://localhost:5310
name: grillingstone

services:
  grillingstone:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: grillingstone:local
    # tini as PID 1: forwards stop signals and reaps the Assistant processes sessions leave behind.
    init: true
    # Docker's default seccomp profile plus what Codex's sandbox needs; see "Codex's sandbox" in docker/README.md.
    security_opt:
      - seccomp=seccomp-codex.json
      # Nothing in the container may gain privileges, and it holds no Linux capabilities: neither Assistant needs any.
      - no-new-privileges:true
    cap_drop:
      - ALL
    ports:
      # Same port on both sides: the backend accepts browser calls only from localhost:5310.
      # Bound to 127.0.0.1 because the tool has no login of its own.
      - '127.0.0.1:5310:5310'
    volumes:
      # Projects, Drafts, Templates and settings stay in the repository's data/ folder.
      - ../data:/app/data
      # Claude Code's login and conversation copies.
      - claude-home:/home/node/.claude
      # Codex's login and saved threads.
      - codex-home:/home/node/.codex
    # Longer than the backend's own 4 s shutdown, so sessions save their Transcripts.
    stop_grace_period: 10s

volumes:
  claude-home:
  codex-home:
