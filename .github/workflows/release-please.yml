# Keeps the release PR up to date on every merge to master. Merging that PR cuts a release:
# CHANGELOG.md, the package.json version, the tag and a draft GitHub Release (see CONTRIBUTING.md).
name: release-please

on:
  push:
    branches: [master]

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
